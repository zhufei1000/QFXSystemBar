name: Publish AddOn

on:
  push:
    tags:
      - "[0-9]*"

permissions:
  contents: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  CF_API_KEY: ${{ secrets.CF_API_KEY }}
  GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}

jobs:
  publish:
    name: Package and publish
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME}"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use the X.Y.Z format (for example, 1.8.06)." >&2
            exit 1
          fi

          python3 tests/validate_release.py --version "${version}"

      - name: Validate release package
        run: python3 tests/ReleasePackaging_test.py

      - name: Build and publish release
        uses: BigWigsMods/packager@v2.7.0
        with:
          args: -n "{package-name}_{project-version}:{project-version}"
